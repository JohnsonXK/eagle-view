name: Build EagleView

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build arm64-v8a .so
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package
        run: |
          mkdir -p dist/pack
          cp manifest.json dist/pack/
          cp build/libEagleView.so dist/pack/
          cd dist/pack
          zip -r ../EagleView.levipack manifest.json libEagleView.so

      - uses: actions/upload-artifact@v4
        with:
          name: EagleView
          path: dist/EagleView.levipack
